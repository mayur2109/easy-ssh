[package]
name = "easy-ssh"
version = "0.1.0"
edition = "2024"
description = "A terminal project manager for SSH connections and remote working directories"
license = "MIT"
repository = "https://github.com/mayur2109/easy-ssh"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
glob = "0.3"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.15"
toml = "0.8"

[dev-dependencies]
pretty_assertions = "1.4"
